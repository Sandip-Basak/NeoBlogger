<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  </head>
  <body>
    <div class="container text-center border border-2 
    border-dark mt-3 bg-warning rounded-3 p-2">
        <div class="row justify-content-between">
            <div class="col-3">
                <h1>NeoBlogger</h1>
            </div>
            <div class="col-4 d-inline-flex">
                {% if user.is_authenticated %}
                <a href="/profile" class="btn btn-primary w-100 border border-2 border-dark">Profile</a>
                {% else %}
                <a href="/signup" class="mx-1 btn btn-info w-100 border border-2 border-dark">Sign Up</a>
                <a href="/signin" class="mx-1 btn btn-success w-100 border border-2 border-dark">Sign In</a>
                {% endif %}
            </div>
        </div>
    </div>

    <div class="container mt-3">
        {% for blog in blogs %}
            <div class="border border-2 border-dark my-2 p-3">
                <h3>{{ blog.title }}</h3>
                <p>{{ blog.content }}</p>
                <p>By: {{ blog.author.username }} | {{ blog.created_at }}</p>
            </div>
        {% endfor %}
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  </body>
</html>
