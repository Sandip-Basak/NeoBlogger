<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  </head>
  <body>
    <div class="container text-center border border-2 
    border-dark mt-3 bg-warning rounded-3 p-2">
        <div class="row justify-content-between">
            <div class="col-3">
                <h1>Welcome {{ request.user.first_name }}</h1>
            </div>
            <div class="col-4 d-inline-flex">
                <a href="/" class="mx-1 btn btn-primary w-100 border border-2 border-dark">Home</a>
                <a href="/logout" class="mx-1 btn btn-danger w-100">Sign Out</a>

            </div>
        </div>
    </div>

    <div class="container my-2">
        <div class="row justify-content-end">
            <div class="col-2">
                <a href="/add_blog" class="btn btn-outline-success w-100">Add New Blog</a>
            </div>
        </div>
    </div>

    <div class="container mt-3">
        {% for blog in blogs %}
        <div class="border border-2 border-dark my-2 p-3">
            <h3>{{ blog.title }}</h3>
            <p>{{ blog.content }}</p>
            <p>{{ blog.created_at }}</p>
            <a href="/edit_blog/{{ blog.id }}" class="btn btn-outline-warning">Edit</a>
            <a href="/delete_blog/{{ blog.id }}" class="btn btn-outline-danger">Delete</a>
        </div>
    {% endfor %}
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  </body>
</html>
